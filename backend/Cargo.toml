[package]
name = "fileflow"
version = "1.0.0"
edition = "2021"
publish = false

[lib]
name = "fileflow"
path = "src/lib.rs"

[[bin]]
name = "fileflow"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
axum-extra = { version = "0.9", features = ["cookie"] }
tokio = { version = "1", features = ["fs", "io-util", "rt-multi-thread", "sync", "time", "macros", "signal"] }
tower = { version = "0.4" }
tower-http = { version = "0.5", features = ["cors", "fs", "compression-gzip", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# v10 requires an explicit crypto backend. We only use HS256 (HMAC-SHA256), so
# the pure-Rust provider covers it and keeps the distroless build free of C deps.
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
bcrypt = "0.15"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
mime_guess = "2"
tokio-util = { version = "0.7", features = ["io"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "1"
walkdir = "2"
time = "0.3"
futures = "0.3"
bytes = "1"
percent-encoding = "2"
totp-rs = { version = "5", features = ["gen_secret", "qr"] }
base64 = "0.22"
rand = "0.9"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs", "time"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"

# Enforced in CI with `cargo clippy --all-targets -- -D warnings`.
# A bare unwrap() in a request path is a remotely triggerable panic: handle the
# error, or use expect() with the invariant that makes it impossible.
[lints.clippy]
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
