# cargo-deny policy (run in CI by .github/workflows/security.yml).
# Advisories overlap with cargo-audit on purpose: cargo-audit stays as the
# reference RustSec gate, cargo-deny adds licences, bans and sources.

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl", # the distroless release image
]

[advisories]
# Keep in sync with .cargo/audit.toml, which documents why each is unreachable.
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa via jsonwebtoken rust_crypto; RS* never used, tokens are HS256-only" },
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint via jsonwebtoken ES256/ES384; tokens are HS256-only" },
]

[licenses]
# Permissive licences only; anything else needs an explicit decision here.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# FileFlow itself is unpublished (publish = false) and carries no licence.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Compression backends with a history of memory-safety advisories; zip is
# built with deflate only (see Cargo.toml). Fail if one creeps back in.
deny = [
    { name = "zstd-safe" },
    { name = "zstd-sys" },
    { name = "bzip2-sys" },
]

[sources]
# Only crates.io: no git dependencies or alternative registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
